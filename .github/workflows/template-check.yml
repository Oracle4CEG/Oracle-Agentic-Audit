name: Template checks only
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m oracle_audit template-check
      - run: python -m oracle_audit smoke
      - name: Verify real-research gate remains blocked in scaffold
        shell: bash
        run: |
          if python -m oracle_audit release-check; then
            echo "ERROR: scaffold must not certify paper replication"
            exit 1
          fi
