name: Pinned scientific replay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m experiments.download
      - run: python -m unittest discover -s tests -v
      - run: python -m oracle_audit experiment-check
      - run: python -m analysis.replay --retrain --out outputs/ci_replay
      - run: python -m analysis.verify_replay --reference outputs/final --candidate outputs/ci_replay
      - name: Report independent publication gates
        shell: bash
        run: |
          python -m oracle_audit release-check || test $? -eq 2
