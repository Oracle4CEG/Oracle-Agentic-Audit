name: Pinned public notebook replay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - run: python -m pip install -r requirements-notebook.txt
      - run: python -m pip check
      - run: python scripts/execute_notebook.py
      - name: Preserve actual notebook outputs and acceptance records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-notebook-reproduction
          path: reports/public_reproduction/
          if-no-files-found: error
          retention-days: 90
